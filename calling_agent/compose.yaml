services:
  mamo:
    build:
      context: ..
      dockerfile: calling_agent/Dockerfile
    env_file: ../.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mamo_data:/app/data/calling_agent
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mamo_data:
