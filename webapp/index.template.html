<title>Pár minut pro sebe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
/* Layout: Apple-style. Frosted top bar, centered hero, one statement per chapter with a single abstract visual, bento tiles, iOS-style lists. Type does the heavy lifting. */
:root{
  --bg:#FBFBFD; --card:#F5F5F7; --card2:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --line:#D2D2D7;
  --accent:#D91E4E; --on-accent:#FFFFFF; --glow:#FF2D55; --ring:rgba(217,30,78,.16);
  --teal:#0E8A86; --teal-soft:#E2F4F3; --glass:rgba(251,251,253,.72); --shadow:rgba(0,0,0,.08);
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --ink2:#A1A1A6; --line:#38383A;
  --accent:#FF375F; --on-accent:#000000; --glow:#FF375F; --ring:rgba(255,55,95,.22);
  --teal:#40C8C0; --teal-soft:#0F2B2A; --glass:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --ink2:#A1A1A6; --line:#38383A;
  --accent:#FF375F; --on-accent:#000000; --glow:#FF375F; --ring:rgba(255,55,95,.22);
  --teal:#40C8C0; --teal-soft:#0F2B2A; --glass:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark}
html{font-size:17px;scroll-behavior:smooth}
html[data-big]{font-size:21px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.47 var(--f);-webkit-font-smoothing:antialiased;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
h1:focus,h2:focus{outline:none}
.grad{background:linear-gradient(90deg,#FF2D55,#FF8A5B);-webkit-background-clip:text;background-clip:text;color:transparent}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-20px;padding-inline:20px;height:56px;
  display:flex;align-items:center;gap:12px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{width:100%;max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{all:unset;cursor:pointer;white-space:nowrap;font-weight:650;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#FFC2D1,#FF4D79 60%,#C2185B)}
.brand:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.sp{flex:1}
.mini{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;height:34px;min-width:34px;padding:0 14px;border-radius:17px;font-weight:600;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink)}
.mini.pri{background:var(--accent);color:var(--on-accent)}
.mini:hover{filter:brightness(.96)}
.mini:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:0 32px;border-radius:28px;font-weight:600;font-size:1.1rem;letter-spacing:-.01em;
  background:var(--accent);color:var(--on-accent);transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .2s}
.btn:hover{transform:scale(1.03)} .btn:active{transform:scale(.98)}
.btn.soft{background:var(--card);color:var(--ink)}
.btn.link{background:none;color:var(--accent);padding:0 8px}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a.btn{text-decoration:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.circ{all:unset;box-sizing:border-box;cursor:pointer;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);transition:transform .2s}
.circ:hover{transform:scale(1.08)} .circ:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.circ.pri{background:var(--accent);color:var(--on-accent)}
.circ[disabled]{opacity:.35;cursor:default;transform:none}

/* views */
#app{max-width:1080px;margin:0 auto}
.view{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(6px)}}
.rise>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(1){animation-delay:.02s}.rise>*:nth-child(2){animation-delay:.1s}.rise>*:nth-child(3){animation-delay:.18s}
.rise>*:nth-child(4){animation-delay:.26s}.rise>*:nth-child(5){animation-delay:.34s}.rise>*:nth-child(6){animation-delay:.42s}

/* hero */
.hero{position:relative;text-align:center;padding-block:clamp(56px,11vh,120px) clamp(64px,10vh,110px);display:flex;flex-direction:column;align-items:center;gap:22px;overflow:visible}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.hero::before{width:420px;height:420px;left:6%;top:6%;background:#FF9AB5}
.hero::after{width:380px;height:380px;right:4%;top:20%;background:#B6A4FF;animation-delay:-7s}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.15)}}
.eyebrow{font-size:1.05rem;font-weight:600;color:var(--accent);letter-spacing:-.005em}
.display{font-size:clamp(2.9rem,9.4vw,6.2rem);font-weight:750;letter-spacing:-.045em;line-height:1;text-wrap:balance}
.lede{font-size:clamp(1.2rem,2.6vw,1.7rem);color:var(--ink2);max-width:24em;line-height:1.3;text-wrap:balance;letter-spacing:-.015em}
.actions{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* tiles */
.sechead{text-align:center;display:grid;gap:10px;padding-block:20px 36px}
.h2{font-size:clamp(2rem,5.4vw,3.4rem);font-weight:720;letter-spacing:-.04em;line-height:1.05;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;border-radius:32px;background:var(--card);min-height:380px;padding:32px;
  display:flex;flex-direction:column;gap:10px;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.tile:hover{transform:scale(1.025);box-shadow:0 30px 60px -20px var(--shadow)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.tile .tag{font-size:.9rem;font-weight:600;color:var(--ink2)}
.tile .big{font-size:clamp(1.9rem,3.3vw,2.4rem);font-weight:720;letter-spacing:-.035em;line-height:1.05;position:relative;z-index:1}
.tile .sm{color:var(--ink2);font-size:1.02rem;position:relative;z-index:1;max-width:14em}
.tile .orb{position:absolute;right:-60px;bottom:-60px;width:230px}
.tile .plus{position:absolute;left:28px;bottom:28px;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .3s}
.tile:hover .plus{transform:rotate(90deg)}
.tile .plus svg{width:18px;height:18px;stroke-width:2.6}
.legal{text-align:center;font-size:.8rem;color:var(--ink2);max-width:46em;margin:48px auto 40px}

/* orb */
.orb{--o1:#FFC2D1;--o2:#FF4D79;--o3:#C2185B;width:min(62vw,270px);aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle at 30% 26%,var(--o1),var(--o2) 56%,var(--o3));
  box-shadow:0 40px 90px -20px var(--o2),inset -16px -24px 44px rgba(0,0,0,.14),inset 12px 16px 34px rgba(255,255,255,.38);animation:breathe 5s ease-in-out infinite}
.orb.peach{--o1:#FFE0CC;--o2:#FF8A65;--o3:#D84315}
.orb.lilac{--o1:#E6DCFF;--o2:#9B7BFF;--o3:#5B3FD1}
.orb.mint{--o1:#D5F5EE;--o2:#34C7B8;--o3:#0E7C7B}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--o2);opacity:0;animation:ripple 4.5s ease-out infinite}
.orb::after{animation-delay:2.2s}
.tile .orb::before,.tile .orb::after{display:none}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes ripple{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.8);opacity:0}}

/* chapter */
.chapter{min-height:calc(100vh - 56px - 24px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-block:clamp(28px,6vh,64px) 20px;max-width:880px;margin:0 auto}
.statement{font-size:clamp(2.3rem,6.4vw,4.4rem);font-weight:740;letter-spacing:-.04em;line-height:1.04;text-wrap:balance}
.sub{font-size:clamp(1.15rem,2.3vw,1.45rem);color:var(--ink2);max-width:27em;line-height:1.35;text-wrap:balance;letter-spacing:-.012em}
.src{font-size:.82rem;color:var(--ink2)}
.visual{width:100%;display:grid;place-items:center;margin-block:12px;min-height:240px}
.controls{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.dots{display:flex;gap:8px;align-items:center;min-width:90px;justify-content:center}
.dot{width:8px;height:8px;border-radius:4px;background:var(--line);transition:all .4s cubic-bezier(.2,.8,.2,1)}
.dot.on{width:30px;background:var(--ink)}
.help{display:flex;gap:14px;align-items:center;text-align:left;border-radius:20px;background:var(--card);padding:16px 20px;max-width:560px;font-size:.95rem;color:var(--ink2)}
.help svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sbody .help{max-width:none}

/* visuals */
.tl{width:min(100%,720px);padding:96px 36px 0}
.tl-track{position:relative;height:16px;border-radius:8px;background:var(--card)}
.tl-fill{position:absolute;inset:0 auto 0 0;width:62%;border-radius:8px;background:linear-gradient(90deg,var(--teal),#34C7B8);transform-origin:left;animation:growx 1.6s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.tl-node{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 8px var(--ring);
  animation:popn .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d)}
.tl-node.n1{left:62%} .tl-node.n2{left:100%;background:var(--card2);border:3px dashed var(--ink2);box-shadow:none}
@keyframes popn{from{transform:scale(0);opacity:0}}
.tl-node em{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.tl-node small{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.9rem;font-weight:500;color:var(--ink2)}
.tl-cap{display:flex;justify-content:space-between;margin-top:18px;font-weight:600;color:var(--teal);font-size:.95rem}
.ten{display:grid;gap:22px;justify-items:center}
.ten-n{font-size:clamp(3rem,8vw,4.8rem);font-weight:760;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.dots10{display:grid;grid-template-columns:repeat(5,minmax(0,64px));gap:16px}
.dots10 i{aspect-ratio:1;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.dots10 i.on{background:linear-gradient(140deg,#FF6B8E,var(--accent));border-color:transparent;box-shadow:0 10px 24px -8px var(--glow);
  animation:dotin .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.45s + var(--i)*.14s)}
@keyframes dotin{from{transform:scale(.3);opacity:0}}
.ringwrap{position:relative;width:min(70vw,290px);aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;display:block}
.ring-fg{stroke-dasharray:319.7 603.2;animation:ringdraw 1.8s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringdraw{from{stroke-dashoffset:319.7}}
.ringnum{position:absolute;inset:0;display:grid;place-items:center;font-size:3.6rem;font-weight:760;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.press{display:grid;gap:22px;justify-items:center}
.press-stage{--h:200px;--t:46px;position:relative;width:min(100%,340px);height:var(--h)}
.pl{position:absolute;left:0;right:0;height:14px;border-radius:7px;background:var(--ink2);opacity:.45}
.pl.top{top:6px}.pl.bot{bottom:6px}
.blob{position:absolute;left:50%;top:50%;width:210px;height:calc(var(--h)*.58);margin:calc(var(--h)*-.29) 0 0 -105px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFC2D1,#FF4D79 70%)}
.pl,.blob{transform-box:fill-box}
.go .pl.top{animation:pt 5s ease-in-out forwards}.go .pl.bot{animation:pb 5s ease-in-out forwards}.go .blob{animation:bl 5s ease-in-out forwards}
@keyframes pt{12%,88%{transform:translateY(var(--t))}100%{transform:none}}
@keyframes pb{12%,88%{transform:translateY(calc(var(--t)*-1))}100%{transform:none}}
@keyframes bl{12%,88%{transform:scaleY(.57)}100%{transform:none}}
.play{all:unset;box-sizing:border-box;cursor:pointer;position:relative;width:96px;height:96px;display:grid;place-items:center}
.play svg.pr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.play .core{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:transform .2s}
.play:hover .core{transform:scale(1.06)}
.play:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:50%}
.pr-fg{stroke-dasharray:276.5;stroke-dashoffset:276.5}
.run .pr-fg{animation:prog 5s linear forwards}
@keyframes prog{to{stroke-dashoffset:0}}
.pmsg{min-height:1.6rem;font-weight:650;color:var(--teal);font-size:1.15rem;opacity:0;transition:opacity .4s}
.pmsg.show{opacity:1}
.visit{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;width:min(100%,720px)}
.vt{display:grid;gap:12px;justify-items:center;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i)*.14s)}
.vt .sq{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 16px 30px -12px var(--c2)}
.vt .sq svg{width:38px;height:38px;stroke-width:1.7}
.vt b{font-weight:650;font-size:1.05rem}
.vt span{color:var(--ink2);font-size:.9rem;line-height:1.3}
.group{width:min(100%,560px);background:var(--card);border-radius:24px;overflow:hidden;text-align:left}
.grow{display:flex;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--line);animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i)*.15s)}
.grow:first-child{border-top:none}
.grow .sq{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(145deg,var(--c1),var(--c2))}
.grow .sq svg{width:24px;height:24px}
.grow b{display:block;font-weight:650;font-size:1.05rem}
.grow span{color:var(--ink2);font-size:.95rem;line-height:1.35}
.paths{width:min(100%,600px);display:grid;gap:18px;text-align:left}
.pth{display:grid;gap:8px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.2s + var(--i)*.3s)}
.pth .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pth b{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.pth span{color:var(--ink2);font-size:.95rem;text-align:right}
.pth .tr{height:14px;border-radius:7px;background:var(--card);overflow:hidden}
.pth .tr i{display:block;height:100%;border-radius:7px;width:var(--w);transform-origin:left;animation:growx 1.2s calc(.5s + var(--i)*.3s) cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(90deg,var(--c1),var(--c2))}
.survsec{padding-block:clamp(40px,8vh,90px) 20px;display:grid;gap:8px;justify-items:center}
.survsec .paths{width:min(100%,680px);margin-top:28px;padding:28px;background:var(--card);border-radius:32px}
.survsec .pth .tr{background:var(--card2)}
.pending .pth,.pending .pth .tr i{animation-play-state:paused}
.pth .val{color:var(--ink);font-weight:740;font-size:1.6rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pth .cap{text-align:left;font-size:.92rem}
.okc{width:min(60vw,200px)}
.okc svg{width:100%;height:auto;display:block}
.okc .c1{stroke-dasharray:100;animation:dash 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
.okc .c2{stroke-dasharray:100;animation:dash .7s 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes dash{from{stroke-dashoffset:100}}
.dose{width:min(100%,560px);display:grid;gap:16px}
.dose .trk{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,var(--teal),#B8D86B 45%,#FFB347 72%,var(--accent))}
.dose .knob{position:absolute;top:50%;left:7%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28);animation:knob 1.6s .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes knob{from{transform:translateX(420px)}}
.dose .lab{display:flex;justify-content:space-between;font-weight:650}
.dose .lab span:last-child{color:var(--ink2);font-weight:500}
.calbig{width:150px;height:150px;border-radius:40px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#FF6B8E,var(--accent));
  box-shadow:0 40px 80px -24px var(--glow);animation:popn .9s cubic-bezier(.3,1.5,.5,1) both}
.calbig svg{width:76px;height:76px;stroke-width:1.6}

/* booking */
.page{padding-block:clamp(36px,8vh,80px) 56px;display:grid;gap:28px;justify-items:center;text-align:center}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(100%,820px);text-align:left}
.lst{background:var(--card);border-radius:24px;overflow:hidden}
.rowb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;padding:0 20px;border-top:1px solid var(--line);font-weight:550;font-size:1.05rem}
.rowb:first-child{border-top:none}
.rowb:hover{background:var(--card2)}
.rowb svg{width:18px;height:18px;color:var(--ink2)}
.rowb:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:0}
.ctrs{display:grid;gap:16px;width:min(100%,860px);text-align:left}
.ctr{display:grid;grid-template-columns:150px 1fr;background:var(--card);border-radius:28px;overflow:hidden;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.1s)}
.ctr .w{display:grid;align-content:center;justify-items:center;padding:20px 12px;background:var(--card2);text-align:center}
.ctr .w b{font-size:3.4rem;font-weight:760;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.ctr .w span{color:var(--ink2);font-weight:600;font-size:.95rem}
.ctr .w.best b{background:linear-gradient(90deg,var(--teal),#34C7B8);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctr .bd{padding:22px 24px;display:grid;gap:10px;align-content:center;min-width:0}
.ctr h3{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.ctr .ad{color:var(--ink2)}
.ctr .bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ctr .btn{min-height:46px;padding:0 20px;font-size:1rem}
.ctr .btn.soft{background:var(--card2)}
.badge{justify-self:start;font-size:.8rem;font-weight:700;letter-spacing:.02em;color:var(--teal);background:var(--teal-soft);padding:4px 12px;border-radius:99px}
.ph{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

@media (max-height:860px){
  .press-stage{--h:160px;--t:37px}
  .dots10{grid-template-columns:repeat(5,52px);gap:12px}

  surv: () => `<div class="paths" role="img" aria-label="Pětileté přežití podle rozsahu nemoci: jen v prsu 100 procent, v okolí 87 procent, vzdálené metastázy 33 procent">${[['Jen v prsu', '100 %', 'Změna je pořád jen v prsu.', '100%', '#4CD9C0', '#0E8A86'], ['Rozšířená do okolí', '87 %', 'Zasažené jsou i blízké uzliny.', '87.2%', '#FFD08A', '#F0A030'], ['Daleko od prsu', '33 %', 'Nemoc se rozšířila do dalších orgánů.', '32.6%', '#FF8FA8', '#D91E4E']]
    .map((r, i) => `<div class="pth" style="--i:${i};--w:${r[3]};--c1:${r[4]};--c2:${r[5]}"><div class="row"><b>${r[0]}</b><span class="val">${r[1]}</span></div><div class="tr"><i></i></div><span class="cap">${r[2]}</span></div>`).join('')}
    <p class="src" style="text-align:center">Podíl žen, které žijí 5 let po diagnóze. Léčba se neustále zlepšuje, dnešní výsledky bývají lepší.</p></div>`,
  check: () => `<div class="okc" role="img" aria-label="Zaškrtnutí"><svg viewBox="0 0 120 120"><circle class="c1" pathLength="100" cx="60" cy="60" r="52" fill="none" stroke="var(--teal)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 60 60)"/><path class="c2" pathLength="100" d="M36 62l16 16 32-36" fill="none" stroke="var(--teal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`,
  dose: () => `<div class="dose" role="img" aria-label="Škála dávky záření, značka je u velmi nízké"><div class="trk"><i class="knob"></i></div><div class="lab"><span>Velmi nízká</span><span>Vysoká</span></div></div>`,
  cal: () => `<div class="calbig" role="img" aria-label="Kalendář">${ico('i-cal', 'ico')}</div>`,
};
function mountVisual(kind, root) {
  if (kind === 'ten') countUp($('#n9', root), 9, 450, 1500);
  if (kind === 'ring') countUp($('#n53', root), 53, 300, 1800);
  if (kind === 'press') {
    const stage = $('#stage', root), play = $('#play', root), msg = $('#pmsg', root); let busy = false;
    play.addEventListener('click', () => {
      if (busy) return; busy = true;
      stage.classList.remove('go'); play.classList.remove('run'); void stage.offsetWidth;
      stage.classList.add('go'); play.classList.add('run'); msg.textContent = 'Držíme…'; msg.classList.add('show');
      setTimeout(() => { msg.textContent = 'Hotovo. Takhle krátce to trvá.'; stage.classList.remove('go'); play.classList.remove('run'); busy = false; }, reduced ? 300 : 5200);
    });
  }
}

const app = $('#app');
function show(node, focusSel = 'h1,h2') {

}
$('#brand').addEventListener('click', () => home());
$('#navbook').addEventListener('click', () => booking());

  const l = el('button', 'btn link', `Co vás zdržuje?${ico('i-chev')}`); l.type = 'button'; l.addEventListener('click', () => $('#tiles').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }));
  act.append(b, l); hero.appendChild(act);
  v.appendChild(hero);
  const ss = el('section', 'survsec pending'); ss.id = 'vcas';

  v.appendChild(ss);
  if ('IntersectionObserver' in window) { const io = new IntersectionObserver((e) => { if (e[0].isIntersecting) { ss.classList.remove('pending'); io.disconnect(); } }, { threshold: 0.25 }); io.observe(ss); } else ss.classList.remove('pending');
  const vs = el('section', 'vidsec'); vs.id = 'videa';
  const vh = el('div', 'sechead'); vh.append(txt('p', 'eyebrow', 'Za půl minuty'), txt('h2', 'h2', 'Podívejte se, jak to chodí.'));
  vs.append(vh, el('div', 'vids', video('exam') + video('surv')));
  v.appendChild(vs);
  const sec = el('section'); sec.id = 'tiles';
  const hd = el('div', 'sechead'); hd.appendChild(txt('h2', 'h2', 'Co vás zdržuje?')); const ld = txt('p', 'lede', 'Vyberte svou obavu. Odpovíme vám během minuty.'); ld.style.margin = '0 auto'; hd.appendChild(ld);
  sec.appendChild(hd);
  const grid = el('div', 'tiles');
  Object.entries(FLOWS).forEach(([k, f]) => {
    const t = el('button', 'tile', `<span class="tag">${f.kick}</span><span class="big">${f.q}.</span><span class="sm">${f.sub}</span><span class="orb ${f.orb}"></span><span class="plus">${ico('i-plus')}</span>`);
    t.type = 'button'; t.addEventListener('click', () => flow(k, 0));
    grid.appendChild(t);
  });
  sec.appendChild(grid); v.appendChild(sec);
  v.appendChild(txt('p', 'legal', 'Prototyp z Rakathonu 2026. Nejde o oficiální stránku pojišťovny ani o lékařskou radu. Čísla pocházejí z dat výzvy. Stránka nic nesbírá.'));
  show(v, 'h1');

function flow(key, i) {
  const f = FLOWS[key], st = f.steps[i], last = i === f.steps.length - 1;
  const v = el('div', 'view'); v.dataset.view = 'flow';
  const c = el('section', 'chapter rise');
  c.appendChild(txt('p', 'eyebrow', f.tag));
  c.appendChild(txt('h1', 'statement', st.h));
  c.appendChild(txt('p', 'sub', st.p));
  c.appendChild(el('div', 'visual', VIS[st.vis](st)));
  if (st.src) c.appendChild(txt('p', 'src', (st.vis === 'press' ? '' : 'Zdroj: ') + st.src));
  if (st.cta) c.appendChild(el('div', 'help', `${ico('i-warn', '')}<p>${SAFETY}</p>`));
  const ctl = el('div', 'controls');
  const back = el('button', 'circ', ico('i-back')); back.type = 'button'; back.setAttribute('aria-label', i === 0 ? 'Zpět domů' : 'Předchozí krok');
  back.addEventListener('click', () => { i === 0 ? home() : flow(key, i - 1); });
  const dots = el('div', 'dots'); dots.setAttribute('role', 'img'); dots.setAttribute('aria-label', `Krok ${i + 1} z ${f.steps.length}`);
  f.steps.forEach((_, j) => dots.appendChild(el('span', 'dot' + (j === i ? ' on' : ''))));
  ctl.append(back, dots);
  if (last) { const go = el('button', 'btn', `${ico('i-cal')}Objednat se`); go.type = 'button'; go.addEventListener('click', () => booking()); ctl.appendChild(go); }
  else { const nx = el('button', 'circ pri', ico('i-chev')); nx.type = 'button'; nx.setAttribute('aria-label', 'Další krok'); nx.addEventListener('click', () => flow(key, i + 1)); ctl.appendChild(nx); }
  c.appendChild(ctl);
  v.appendChild(c);
  show(v, 'h1');
  mountVisual(st.vis, v);
}

/* ================= demo appointment scheduler (nothing is sent or saved) ================= */
const shortRegion = (r) => r.replace('Hlavní město ', '').replace(/ kraj$/, '').replace(/^Kraj /, '');
const S = { region: null, center: null, date: null, time: null, name: '', phone: '', sms: true };
const pad = (n) => String(n).padStart(2, '0');
const fmtT = (m) => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const fmtD = (d, o) => d.toLocaleDateString('cs-CZ', o);
const isoD = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fnv = (s) => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;
function firstDay(c) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + Math.max(1, c.wait ?? 7)); while (isWeekend(d)) d.setDate(d.getDate() + 1); return d; }
function bookableDays(c) { const out = [], d = firstDay(c); while (out.length < 14) { if (!isWeekend(d)) out.push(new Date(d)); d.setDate(d.getDate() + 1); } return out; }
function slotsFor(c, d) {
  const o = Math.round((c.open ?? 7) * 60), e = Math.round((c.close ?? 15) * 60), r = [];
  for (let m = o; m + 20 <= e; m += 20) r.push({ m, taken: fnv(`${c.id}|${isoD(d)}|${m}`) % 100 < 38 });
  return r;
}
const inDays = (c) => { const n = Math.max(1, c.wait ?? 7); return `za ${n} ${n === 1 ? 'den' : n < 5 ? 'dny' : 'dní'}`; };

function frame({ step, title, lead, back, body, bar }) {
  const v = el('div', 'view'); v.dataset.view = 'booking';
  const p = el('section', 'page rise');
  const top = el('div', 'schedtop');
  const bk = el('button', 'circ', ico('i-back')); bk.type = 'button'; bk.setAttribute('aria-label', 'Zpět'); bk.addEventListener('click', back);
  const prog = el('div', 'prog'); prog.setAttribute('role', 'img'); prog.setAttribute('aria-label', `Krok ${step} ze 4`);
  for (let k = 1; k <= 4; k++) prog.appendChild(el('i', k <= step ? 'on' : ''));
  top.append(bk, prog, txt('span', 'demo', 'Ukázka'));
  p.append(top, txt('h1', 'display', title));
  p.firstChild.nextSibling.style.fontSize = 'clamp(2.4rem,7.2vw,4rem)';
  if (lead) p.appendChild(txt('p', 'lede', lead));
  p.appendChild(body);
  if (bar) p.appendChild(bar);
  v.appendChild(p);
  show(v, 'h1');
}
function booking() { S.center = null; S.date = null; S.time = null; const saved = store.get('kraj'); if (saved && CENTERS.some((c) => c.region === saved)) { S.region = saved; return schedCenter(); } schedRegion(); }

function schedRegion() {
  const regions = [...new Set(CENTERS.map((c) => c.region))].sort((a, b) => shortRegion(a).localeCompare(shortRegion(b), 'cs'));
  const lists = el('div', 'lists');
  [regions.slice(0, Math.ceil(regions.length / 2)), regions.slice(Math.ceil(regions.length / 2))].forEach((part) => {
    const g = el('div', 'lst');
    part.forEach((r) => { const b = el('button', 'rowb', `<span>${shortRegion(r)}</span>${ico('i-chev')}`); b.type = 'button'; b.addEventListener('click', () => { S.region = r; store.set('kraj', r); schedCenter(); }); g.appendChild(b); });
    lists.appendChild(g);
  });
  frame({ step: 1, title: 'Odkud jste?', lead: 'Najdeme centra ve vašem kraji a nabídneme volné termíny.', back: () => home(), body: lists });
}

function schedCenter() {
  const list = CENTERS.filter((c) => c.region === S.region).sort((a, b) => (a.wait ?? 999) - (b.wait ?? 999) || a.city.localeCompare(b.city, 'cs'));
  const wrap = el('div', 'sbody');
  const g = el('div', 'lst crow');
  list.forEach((c, n) => {
    const fd = firstDay(c);
    const b = el('button', 'rowb two', `<span class="rt"><b>${c.name}</b><small>${c.address}, ${c.city}</small></span><span class="rr">${n === 0 ? '<em>Nejdřív</em>' : ''}<strong>${inDays(c)}</strong><small>${fmtD(fd, { weekday: 'short', day: 'numeric', month: 'numeric' })}</small></span>${ico('i-chev')}`);
    b.type = 'button'; b.addEventListener('click', () => { S.center = c; S.date = null; S.time = null; schedTime(); });
    g.appendChild(b);
  });
  wrap.appendChild(g);
  const ch = el('button', 'btn soft', 'Změnit kraj'); ch.type = 'button'; ch.style.minHeight = '44px';
  ch.addEventListener('click', () => { store.set('kraj', ''); schedRegion(); });
  wrap.appendChild(ch);
  frame({ step: 2, title: 'Vyberte centrum.', lead: shortRegion(S.region) + ' · seřazeno podle nejbližšího volného termínu', back: () => { store.set('kraj', ''); schedRegion(); }, body: wrap });
}

function schedTime() {
  const c = S.center, ds = bookableDays(c);
  if (!S.date) S.date = ds[0];
  const wrap = el('div', 'sbody');
  wrap.appendChild(txt('p', 'src', c.name + ' · ' + c.address + ', ' + c.city));
  const strip = el('div', 'days'); strip.setAttribute('role', 'group'); strip.setAttribute('aria-label', 'Den');
  const slotsHost = el('div', 'slots'); slotsHost.setAttribute('role', 'group'); slotsHost.setAttribute('aria-label', 'Čas');
  const bar = el('div', 'sumbar'); const sum = el('p', 'sumtxt'); const go = el('button', 'btn', `Pokračovat${ico('i-chev')}`); go.type = 'button';
  go.addEventListener('click', () => schedDetails()); bar.append(sum, go);
  const refresh = () => {
    [...strip.children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.d === isoD(S.date)));
    slotsHost.replaceChildren();
    const sl = slotsFor(c, S.date);
    if (S.time != null && !sl.some((x) => x.m === S.time && !x.taken)) S.time = null;
    sl.forEach((x) => {
      const b = el('button', 'slot', fmtT(x.m)); b.type = 'button'; b.disabled = x.taken;
      b.setAttribute('aria-pressed', S.time === x.m); if (x.taken) b.setAttribute('aria-label', fmtT(x.m) + ', obsazeno');
      b.addEventListener('click', () => { S.time = x.m; refresh(); });
      slotsHost.appendChild(b);
    });
    sum.textContent = S.time != null ? `${fmtD(S.date, { weekday: 'long', day: 'numeric', month: 'long' })}, ${fmtT(S.time)}` : 'Vyberte čas';
    go.disabled = S.time == null; go.style.opacity = S.time == null ? '.4' : '';
  };
  ds.forEach((d) => {
    const b = el('button', 'day', `<small>${fmtD(d, { weekday: 'short' })}</small><b>${d.getDate()}</b><span>${fmtD(d, { month: 'short' })}</span>`);
    b.type = 'button'; b.dataset.d = isoD(d); b.addEventListener('click', () => { S.date = d; refresh(); });
    strip.appendChild(b);
  });
  wrap.append(strip, slotsHost, txt('p', 'src', 'Přeškrtnuté časy jsou obsazené. Časy se řídí otevírací dobou centra.'));
  frame({ step: 3, title: 'Vyberte termín.', lead: null, back: () => schedCenter(), body: wrap, bar });
  refresh();
}

function schedDetails() {
  const wrap = el('div', 'sbody');
  const box = el('div', 'fields');
  box.innerHTML = `<div class="field"><label for="f-name">Jméno a příjmení</label><input id="f-name" autocomplete="off" placeholder="Jana Nováková"></div>
    <div class="field"><label for="f-phone">Telefon</label><input id="f-phone" inputmode="tel" autocomplete="off" placeholder="+420 777 123 456"></div>
    <div class="field tog"><span id="f-sms-l">Připomenout SMS den předem</span><button class="sw" id="f-sms" type="button" role="switch" aria-labelledby="f-sms-l" aria-checked="true"><i></i></button></div>`;
  wrap.appendChild(box);
  const err = txt('p', 'err', ''); err.setAttribute('role', 'alert'); wrap.appendChild(err);
  wrap.appendChild(txt('p', 'src', 'Ukázka. Zadané údaje se nikam neodesílají ani neukládají.'));
  const bar = el('div', 'sumbar'); bar.appendChild(txt('p', 'sumtxt', `${fmtD(S.date, { weekday: 'long', day: 'numeric', month: 'long' })}, ${fmtT(S.time)}`));
  const go = el('button', 'btn', `${ico('i-cal')}Rezervovat`); go.type = 'button'; bar.appendChild(go);
  frame({ step: 4, title: 'Vaše údaje.', lead: 'Potřebujeme jen jméno a telefon.', back: () => schedTime(), body: wrap, bar });
  const n = $('#f-name'), ph = $('#f-phone'), sw = $('#f-sms');
  n.value = S.name; ph.value = S.phone; sw.setAttribute('aria-checked', S.sms);
  sw.addEventListener('click', () => { S.sms = sw.getAttribute('aria-checked') !== 'true'; sw.setAttribute('aria-checked', S.sms); });
  go.addEventListener('click', () => {
    S.name = n.value.trim(); S.phone = ph.value.trim();
    if (S.name.length < 3) { err.textContent = 'Napište prosím jméno a příjmení.'; n.focus(); return; }
    if (S.sms && S.phone.replace(/\D/g, '').length < 9) { err.textContent = 'Pro SMS připomínku zadejte telefon, nebo ji vypněte.'; ph.focus(); return; }
    schedDone();
  });
}

function schedDone() {
  const c = S.center;
  const wrap = el('div', 'sbody');
  wrap.appendChild(el('div', 'okc', VIS.check().replace(/^<div class="okc"[^>]*>|<\/div>$/g, '')));
  const t = el('div', 'ticket');
  t.innerHTML = `<div class="tk-h"><small>${fmtD(S.date, { weekday: 'long' })}</small><b>${fmtD(S.date, { day: 'numeric', month: 'long' })}</b><span>${fmtT(S.time)}</span></div>
    <div class="tk-b"><div><small>Centrum</small><b></b><span class="ad"></span></div><div><small>Pacientka</small><b class="nm"></b></div></div>`;
  $('.tk-b b', t).textContent = c.name; $('.tk-b .ad', t).textContent = `${c.address}, ${c.city}`; $('.nm', t).textContent = S.name + (S.sms ? ' · SMS připomínka zapnutá' : '');
  wrap.appendChild(t);
  wrap.appendChild(el('div', 'group bring', `<div class="grow" style="--i:0;--c1:#7C8CFF;--c2:#4B5BE0"><div class="sq">${ico('i-ok')}</div><div><b>Co si vzít s sebou</b><span>Průkaz pojištěnce, žádanku nebo pozvánku (pokud ji centrum vyžaduje) a dřívější snímky, jsou-li. Ověřte u centra.</span></div></div>`));
  const demo = el('div', 'help', `${ico('i-warn', '')}<p><b>Je to ukázka.</b> Nic se nerezervovalo a nikomu se neodeslalo. Pro skutečný termín zavolejte do centra.</p>`);
  wrap.appendChild(demo);
  const bt = el('div', 'actions');
  (c.phone || '').split(/,\s*/).filter(Boolean).slice(0, 1).forEach((ph) => { const a = el('a', 'btn', `${ico('i-phone')}<span class="ph">${ph}</span>`); a.href = 'tel:' + ph.replace(/\s/g, ''); bt.appendChild(a); });
  const done = el('button', 'btn soft', 'Hotovo'); done.type = 'button'; done.addEventListener('click', () => { Object.assign(S, { center: null, date: null, time: null, name: '', phone: '' }); home(); });
  bt.appendChild(done); wrap.appendChild(bt);
  const v = el('div', 'view'); v.dataset.view = 'booking';
  const p = el('section', 'page rise');
  p.appendChild(txt('h1', 'display', 'Máte hotovo.')).style.fontSize = 'clamp(2.4rem,7.2vw,4rem)';
  p.appendChild(txt('p', 'lede', 'Takhle by vypadala vaše rezervace.'));
  p.appendChild(wrap); v.appendChild(p);
  show(v, 'h1');
}

document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('video, input')) return;  // arrows seek in a video and move in a field
  const next = $('.controls .circ.pri, .controls .btn'); const back = $('.controls .circ:not(.pri)');
  if (e.key === 'ArrowRight' && next) next.click();
  if (e.key === 'ArrowLeft' && back) back.click();
  if (e.key === 'Escape') home();
});
const hash = (location.hash || '').slice(1);
if (FLOWS[hash]) flow(hash, 0); else if (hash === 'objednat') booking(); else home();
