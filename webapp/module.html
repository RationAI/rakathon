<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modul screeningu</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#6C6C70; --line:#E3E3E8; --accent:#D91E4E; --on-accent:#FFFFFF;
  --teal:#0E8A86; --teal-soft:#E2F4F3; --amber:#B25E00; --amber-soft:#FFF1DC; --shadow:rgba(0,0,0,.14); --desk:#E5E5EA;
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1C1C1E; --ink:#F5F5F7; --ink2:#A1A1A6; --line:#38383A; --accent:#FF375F; --on-accent:#000;
  --teal:#40C8C0; --teal-soft:#0F2B2A; --amber:#FFB347; --amber-soft:#3A2A10; --shadow:rgba(0,0,0,.6); --desk:#111113; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:var(--desk);color:var(--ink);font:400 1rem/1.42 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

.stage{min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;padding:24px 20px}
.side{width:300px;display:grid;gap:18px;align-self:center}
.side h1{font-size:1.5rem;letter-spacing:-.02em;line-height:1.15}
.side p{color:var(--ink2);font-size:.92rem}
.side h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:8px}
.pers{display:grid;gap:8px}
.pers button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border-radius:14px;background:var(--card);display:grid;gap:1px;border:2px solid transparent}
.pers button[aria-pressed="true"]{border-color:var(--accent)}
.pers b{font-size:.98rem}.pers small{color:var(--ink2);font-size:.82rem}
.pers button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.why{background:var(--card);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--ink2)}
.why b{color:var(--ink)}
.proto{font-size:.8rem;color:var(--ink2)}

.phone{width:390px;height:800px;max-height:calc(100vh - 32px);border-radius:46px;background:var(--bg);box-shadow:0 0 0 10px #111,0 40px 90px -20px var(--shadow);overflow:hidden;position:relative;flex:none}
.screen{position:absolute;inset:0;overflow-y:auto;padding:54px 18px 28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.sbar{position:absolute;z-index:6;left:0;right:0;top:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:.85rem;font-weight:650;pointer-events:none}
.view{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes growx{from{transform:scaleX(0)}}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:40px}
.back{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hi{font-size:1.7rem;font-weight:740;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--ink2);margin-top:2px}
.h1{font-size:1.5rem;font-weight:740;letter-spacing:-.03em;line-height:1.12}
.card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;display:grid;gap:10px}
.chip{justify-self:start;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--teal-soft);color:var(--teal)}
.big{font-size:1.3rem;font-weight:730;letter-spacing:-.02em;line-height:1.18}
.mut{color:var(--ink2);font-size:.95rem}
.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:50px;padding:0 20px;border-radius:25px;background:var(--accent);color:var(--on-accent);font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.soft{background:var(--bg);color:var(--ink)}
.view>.btn{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rows{background:var(--card);border-radius:22px;overflow:hidden;margin-top:14px}
.row{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:none}
.row.static{cursor:default}
.row .rt{flex:1;min-width:0;display:grid;gap:1px}
.row .rt b{font-weight:640}.row .rt small{color:var(--ink2);font-size:.84rem}
.row .rr{text-align:right;display:grid;justify-items:end;gap:2px;font-size:.88rem}
.row .rr strong{font-weight:700}
.row em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:2px 9px;border-radius:99px}
.row:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.dotok{width:10px;height:10px;border-radius:50%;background:var(--teal);flex:none}
.dotwarn{background:#F0A030}.dotoff{background:var(--line)}
.sect{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:22px 4px -6px}

/* notification */
.notif{position:absolute;z-index:7;left:10px;right:10px;top:46px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:20px;padding:12px 14px;box-shadow:0 14px 40px -12px var(--shadow);
  display:grid;grid-template-columns:34px 1fr;gap:4px 10px;cursor:pointer;animation:drop .6s .8s cubic-bezier(.3,1.3,.5,1) both;text-align:left;border:none;width:calc(100% - 20px)}
.notif i{grid-row:1/3;width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#FF6B8E,var(--accent));display:grid;place-items:center;color:#fff}
.notif b{font-size:.85rem}.notif span{font-size:.85rem;color:var(--ink2);line-height:1.3}
@keyframes drop{from{transform:translateY(-130%);opacity:0}}

/* paths */
.pth{display:grid;gap:5px}
.pth+.pth{margin-top:12px}
.pth .rw{display:flex;justify-content:space-between;align-items:baseline}
.pth b{font-weight:680}.pth .val{font-weight:750;font-size:1.25rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pth .tr{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.pth .tr i{display:block;height:100%;border-radius:6px;width:var(--w);transform-origin:left;animation:growx 1.1s calc(.3s + var(--i)*.25s) cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(90deg,var(--c1),var(--c2))}
.pth .cap{color:var(--ink2);font-size:.85rem}
.src{color:var(--ink2);font-size:.78rem;margin-top:6px}

/* accordion */
.acc{background:var(--card);border-radius:22px;overflow:hidden;margin-top:14px}
.ah{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-top:1px solid var(--line);font-weight:650}
.acc>.ah:first-child{border-top:none}
.ah .ico{transition:transform .25s}.ah[aria-expanded="true"] .ico{transform:rotate(90deg)}
.ah:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.ab{padding:0 18px 16px;color:var(--ink2);display:grid;gap:8px;font-size:.95rem}
.ab b{color:var(--ink)}

/* slots */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.day{all:unset;box-sizing:border-box;flex:none;width:62px;padding:9px 0;border-radius:16px;background:var(--card);text-align:center;cursor:pointer;display:grid;gap:0}
.day small{font-size:.72rem;text-transform:uppercase;color:var(--ink2);font-weight:650}
.day b{font-size:1.4rem;letter-spacing:-.02em;line-height:1.15}.day span{font-size:.72rem;color:var(--ink2)}
.day[aria-pressed="true"]{background:var(--accent)}
.day[aria-pressed="true"] *{color:var(--on-accent)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{all:unset;box-sizing:border-box;cursor:pointer;min-height:46px;border-radius:13px;background:var(--card);display:grid;place-items:center;font-weight:620;font-variant-numeric:tabular-nums}
.slot[disabled]{opacity:.3;text-decoration:line-through;cursor:default}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day:focus-visible,.slot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;bottom:-28px;margin:16px -18px -28px;padding:14px 18px 28px;background:linear-gradient(to bottom,transparent,var(--bg) 28%);display:grid;gap:8px}
.bar .sum{font-weight:650;text-align:center}

/* done */
.okc{width:92px;margin:6px auto 0}
.okc circle,.okc path{stroke-dasharray:100;animation:dash 1s cubic-bezier(.2,.8,.2,1) both}.okc path{animation-delay:.7s}
@keyframes dash{from{stroke-dashoffset:100}}
.tk{background:var(--card);border-radius:22px;overflow:hidden;margin-top:14px;animation:rise .6s .3s both}
.tkh{background:linear-gradient(145deg,#FF6B8E,var(--accent));color:#fff;padding:16px 18px}
.tkh small{opacity:.9;font-weight:600;text-transform:capitalize}.tkh b{display:block;font-size:1.7rem;letter-spacing:-.03em;line-height:1.1}.tkh span{font-size:1.15rem;font-weight:700}
.tkb{padding:14px 18px;display:grid;gap:10px}.tkb small{display:block;color:var(--ink2);font-size:.76rem;font-weight:650}
.tog{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.tog:first-child{border-top:none}
.sw{all:unset;cursor:pointer;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s}
.sw[aria-checked="true"]{background:var(--teal)}.sw[aria-checked="true"] i{transform:translateX(20px)}
.sw:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 14px;font-size:.85rem;font-weight:600;margin-top:14px}
.safety{display:flex;gap:10px;background:var(--card);border-radius:18px;padding:12px 14px;margin-top:14px;font-size:.86rem;color:var(--ink2)}

@media (max-width:860px){
  .stage{display:block;padding:0}
  .side{width:auto;padding:16px 16px 12px;background:var(--desk)}
  .side .why,.side .proto{display:none}
  .pers{grid-template-columns:1fr 1fr}
  .phone{width:100%;height:auto;min-height:calc(100vh - 150px);max-height:none;border-radius:0;box-shadow:none;position:relative}
  .screen{position:relative;inset:auto;padding-top:20px;min-height:calc(100vh - 150px)}
  .sbar{display:none}
  .notif{position:fixed;top:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  const fin = el('button', 'btn', 'Hotovo'); fin.type = 'button'; fin.style.marginTop = '10px'; fin.addEventListener('click', home); v.appendChild(fin);
  mount(v);
}

/* ---- persona switcher + chrome ---- */
function pick(id) {
  P = PERSONAS.find((p) => p.id === id); S = { center: null, date: null, time: null, sms: true, cal: true };
  [...$('#pers').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id));
  $('#why').innerHTML = `<b>Proč takto:</b> ${P.why}`;
  home();
}
PERSONAS.forEach((p) => { const b = el('button', null, `<b>${p.name}, ${p.age}</b><small>${p.seg}</small>`); b.type = 'button'; b.dataset.id = p.id; b.addEventListener('click', () => pick(p.id)); $('#pers').appendChild(b); });
const tick = () => { const d = new Date(); $('#clock').textContent = `${d.getHours()}:${pad(d.getMinutes())}`; }; tick(); setInterval(tick, 20000);
pick('E');
</script>
