fix = true
line-length = 88
target-version = "py312"
# Script folders import sibling modules by name (e.g. `from data import ...`);
# listing them makes isort treat those modules as first-party.
src = [
    "preprocessing",
    "training",
    "training/classifiers",
    "features",
    "features/spatial",
]

[format]
docstring-code-format = true # Enable reformatting of code snippets in docstrings.

[lint]
unfixable = [
    "ERA", # do not autoremove commented out code
]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "D",   # pydocstyle 
]
extend-ignore = [
    "ERA001", # commented out code
    "D100",   # missing docstring in public module
    "D101",   # missing docstring in public class
    "D102",   # missing docstring in public method
    "D103",   # missing docstring in public function
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D106",   # missing docstring in public nested class
    "D107",   # missing docstring in __init__
    "N812",   # lowercase imported as non lowercase
    "TC002", # move third-party into a type-checking block
    "F722", # jaxtyping
    "N801", # class name lowercase
    "N806", # variable with CAPITALIZED name
    "B020" # local variable shadowing built-in
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
lines-after-imports = 2

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Czech typography: non-breaking spaces and en dashes are intentional.
"presentation/*" = ["RUF001"]
